# CommercialPropertFollowFlow — Docker Compose
# Author: Imran Ahmed <me@imrandev.bd> — https://imrandev.bd/contact

services:
  app:
    build: .
    container_name: commercial-propert-follow-flow-app
    ports:
      - "8143:8000"
    environment:
      APP_NAME: CommercialPropertFollowFlow
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8143
      APP_KEY: "base64:hgzyFGoULqjle81mubkKYYft0n6lqngb8hbNReHHGmY="
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: commercial_propert_follow_flow
      DB_USERNAME: cpff
      DB_PASSWORD: secret
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: commercial-propert-follow-flow-mysql
    environment:
      MYSQL_DATABASE: commercial_propert_follow_flow
      MYSQL_USER: cpff
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33113:3306"
    volumes:
      - cpff_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: commercial-propert-follow-flow-redis
    ports:
      - "63833:6379"
    restart: unless-stopped

volumes:
  cpff_mysql_data:
